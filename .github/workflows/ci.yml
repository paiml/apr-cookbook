# CI — lint, test, coverage, security, and unified gate
name: CI

on:
  # `pull_request`, NOT `pull_request_target`. Two reasons:
  #
  # 1. Bootstrapping the required `gate` context. Under `pull_request_target`
  #    GitHub runs the workflow definition from the BASE branch, so a PR that
  #    ADDS a job can never emit that job's check on itself — the org ruleset
  #    would keep blocking every PR, including the one that fixes the block.
  #    Under `pull_request` the PR's own definition runs, so this PR emits its
  #    own `gate`.
  # 2. Security. This workflow checked out `pull_request.head.sha` and then ran
  #    `cargo clippy`/`cargo test`/build scripts over it. Under
  #    `pull_request_target` that is arbitrary fork code executing with the base
  #    repo's token and secrets (the "pwn request" pattern). `pull_request` runs
  #    the same code with a read-only, secret-less token, which is what these
  #    jobs actually need — nothing here reads a secret.
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  # The event name is part of the key on purpose. A `pull_request` run and a
  # `pull_request_target` run are different workloads against the same PR
  # number; with a shared key they cancel each other. That bites during the
  # migration below — while `main` still defines this workflow on
  # `pull_request_target`, opening a PR that switches it to `pull_request`
  # starts both, and one kills the other ("Canceling since a higher priority
  # waiting request for ci-<n> exists"), taking the `gate` job's upstream jobs
  # down with it.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Job id renamed `gate` -> `quality-gate` so the id `gate` is free for the
  # aggregator below (the org ruleset requires a CONTEXT literally named
  # `gate`). The check-run name is unchanged: `Quality Gate (stable)`.
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable]
    steps:
      # Free ~30GB on the GH runner (Android SDK, .NET, Haskell, large preinstalled
      # tarballs) before doing anything else. Without this, `cargo test --all-features`
      # over a 12-crate workspace + 1670 examples runs out of disk during linking
      # ("ld terminated with signal 7 [Bus error]" / "No space left on device").
      # Tracked upstream at aprender#1020.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v7
        with:
          # Pin to the PR head SHA so the gate evaluates the PR's own commit
          # rather than the ephemeral merge commit — keeps the tested SHA and
          # the reported SHA identical.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Lint (clippy on lib + tests, NOT examples)
        # `--all-targets` would compile all 1670 examples in debug mode
        # (~264MB each = >400GB needed). Scoped to lib + tests keeps
        # disk pressure within the GH-hosted runner's 14GB. Examples
        # are checked separately by the weekly examples-build workflow.
        run: cargo clippy --lib --tests --all-features -- -D warnings

      - name: Test (lib + tests, NOT examples)
        # Same disk-pressure mitigation as clippy. `cargo test` without
        # `--lib --tests` would compile all 1670 examples — too large.
        # The dep-duplication tracked at aprender#1599 makes this even
        # worse (aprender-core 0.29.3 + 0.31.2, trueno 0.19.1 + 0.31.2).
        run: cargo test --lib --tests --all-features

      - name: Security scan (cargo audit)
        run: |
          cargo install cargo-audit --locked || true
          cargo audit
        continue-on-error: true

      # Coverage moved to .github/workflows/coverage.yml (cron schedule)
      # because cargo llvm-cov re-instruments + recompiles, doubling target/
      # size. Off the PR critical path keeps this gate fast.

  # Note: the self-hosted `unified` gate lives in its own workflow file
  # (`unified-gate-advisory.yml`) so its conclusion doesn't taint this
  # workflow's badge. It is advisory — the required branch-protection
  # check is `CI Status` (below).

  # Lean gate — builds the ProvableContracts Lake project under `lean/`.
  # Catches regressions in the PMAT-047 theorem scaffold (e.g. a theorem
  # body stops compiling, or the lakefile/module graph drifts). Uses elan
  # to install the toolchain pinned in `lean/lean-toolchain`.
  #
  # Note: `lake build` emits `declaration uses 'sorry'` warnings for the
  # 16 unproven theorems — that's expected and honest. We don't fail on
  # warnings here; the real regression signal is the build exit code.
  lean-gate:
    name: Lean Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install elan (Lean toolchain manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | \
            sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Lean toolchain check
        working-directory: lean
        run: lean --version

      - uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml') }}

      - name: Build Lean theorem scaffold
        working-directory: lean
        run: lake build

  # Kani gate — runs `cargo kani` against the standalone `kani/` crate which
  # contains 108 #[kani::proof] harnesses (39 base + 69 architecture-demos).
  # All 108 harnesses verify in ~14s locally on a stable laptop; first-run
  # cold install of Kani adds ~3-5min to CI. Cached on toolchain version.
  #
  # This is the runtime witness for D3 Kani 1.0 — every contract obligation
  # that ships a kani_harness pointer now has an actually-verified Rust
  # symbol behind it. PMAT-324.
  kani-gate:
    name: Kani Gate
    runs-on: ubuntu-latest
    steps:
      # Same disk-pressure mitigation as the main gate — Kani install adds
      # ~3GB of binaries and CBMC artifacts on top of cargo target dirs.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/kani-verifier
            ~/.cargo/bin/cargo-kani
            ~/.kani
          key: kani-${{ runner.os }}-0.67.0

      - name: Install Kani
        run: |
          if ! command -v cargo-kani >/dev/null 2>&1; then
            cargo install --locked kani-verifier --version 0.67.0
            cargo kani setup
          fi
          cargo kani --version

      - name: Run Kani harnesses
        working-directory: kani
        run: cargo kani

  # `gate` — the context the paiml org ruleset "Green Main" (id 13878864)
  # requires on every PR:
  #
  #   $ gh api orgs/paiml/rulesets/13878864 --jq '.rules[]
  #       | select(.type=="required_status_checks")
  #       | .parameters.required_status_checks[].context'
  #   gate
  #
  # No workflow in this repo emitted a check by that name, so every PR sat at
  # mergeStateStatus BLOCKED with every visible check green and nothing a
  # contributor could do about it — the missing check was one the repo could
  # not produce.
  #
  # The job id AND the display name must both be the literal string `gate`:
  # the ruleset matches the check-run CONTEXT, so a friendlier name silently
  # re-breaks merging. Do not add a `strategy.matrix` here either — that would
  # suffix the context (`gate (stable)`) and it would stop matching.
  #
  # It measures the repo's real CI: it fails whenever Quality Gate, Lean Gate
  # or Kani Gate did not succeed, and it refuses to report green if it did not
  # actually observe all three (a `gate` that measures nothing is worse than
  # the block it replaces).
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [quality-gate, lean-gate, kani-gate]
    if: always()
    steps:
      - name: Aggregate upstream gate outcomes
        run: |
          set -euo pipefail
          checked=0
          failed=0
          while IFS='=' read -r job result; do
            [ -n "$job" ] || continue
            checked=$((checked + 1))
            if [ "$result" = "success" ]; then
              echo "PASS  $job"
            else
              echo "FAIL  $job: ${result:-<no result reported>}"
              failed=$((failed + 1))
            fi
          done <<EOF
          quality-gate=${{ needs.quality-gate.result }}
          lean-gate=${{ needs.lean-gate.result }}
          kani-gate=${{ needs.kani-gate.result }}
          EOF
          echo "checked $checked upstream job(s), $failed failing"
          # Denominator guard: if a future edit drops an entry from `needs:`,
          # its result expression expands to the empty string and the pair is
          # dropped here. Refuse to pass on a shrunken denominator rather than
          # quietly guarding less.
          if [ "$checked" -ne 3 ]; then
            echo "gate observed $checked of the 3 jobs it declares in needs: — refusing to report green"
            exit 1
          fi
          [ "$failed" -eq 0 ]

  # Summary job that reports GREEN if the local Quality Gate + Lean Gate +
  # Kani Gate passed, regardless of the self-hosted unified gate's health.
  #
  # Kept because the repo-level branch protection on `main` still requires the
  # context `CI Status` (app_id 15368) — removing or renaming this job would
  # trade the org-ruleset block for a branch-protection one. It now mirrors
  # `gate` rather than duplicating its logic, so the two required contexts
  # cannot disagree.
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [gate]
    if: always()
    steps:
      - name: Report the aggregate gate outcome
        run: |
          r="${{ needs.gate.result }}"
          echo "gate: ${r:-<no result reported>}"
          [ "$r" = "success" ]
