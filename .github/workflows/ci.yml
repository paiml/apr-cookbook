# CI — lint, test, coverage, security, and unified gate
name: CI

on:
  # `pull_request`, NOT `pull_request_target`. Two reasons:
  #
  # 1. Bootstrapping the required `gate` context. Under `pull_request_target`
  #    GitHub runs the workflow definition from the BASE branch, so a PR that
  #    ADDS a job can never emit that job's check on itself — the org ruleset
  #    would keep blocking every PR, including the one that fixes the block.
  #    Under `pull_request` the PR's own definition runs, so this PR emits its
  #    own `gate`.
  # 2. Security. This workflow checked out `pull_request.head.sha` and then ran
  #    `cargo clippy`/`cargo test`/build scripts over it. Under
  #    `pull_request_target` that is arbitrary fork code executing with the base
  #    repo's token and secrets (the "pwn request" pattern). `pull_request` runs
  #    the same code with a read-only, secret-less token, which is what these
  #    jobs actually need — nothing here reads a secret.
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
    # #441: coverage runs on a v* tag only (sovereign-ci coverage_on: tag; fleet ruling
    # aprender#3676). The input alone would never fire: a branch-filtered push misses tags.
    tags: ['v*']
  workflow_dispatch:

concurrency:
  # The event name is part of the key on purpose. A `pull_request` run and a
  # `pull_request_target` run are different workloads against the same PR
  # number; with a shared key they cancel each other. That bites during the
  # migration below — while `main` still defines this workflow on
  # `pull_request_target`, opening a PR that switches it to `pull_request`
  # starts both, and one kills the other ("Canceling since a higher priority
  # waiting request for ci-<n> exists"), taking the `gate` job's upstream jobs
  # down with it.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # #441: lint + test + security run in the fleet's reusable sovereign-ci workflow, pinned by
  # sha as apex pins it (a moving `@main` is not auditable). It runs every job inside the
  # sovereign-ci image on the self-hosted clean-room pool, with the EACCES self-heal and
  # sccache. Its checks are prefixed `ci / ...`, so its own `gate` job cannot collide with the
  # top-level `gate` below. Scope is unchanged: lib + tests, never the 1670 examples
  # (`cargo test --lib --tests`, `cargo clippy --lib --tests`).
  ci:
    uses: paiml/.github/.github/workflows/sovereign-ci.yml@69482db7821ce792c2137077da24695bb7a0fbea # main @ 2026-09-21, as apex
    with:
      repo: apr-cookbook
      clippy_args: '--lib --tests --all-features'
      test_args: '--tests --all-features'
      coverage_on: tag
    secrets: inherit

  # Lean gate: builds the ProvableContracts Lake project under `lean/` (toolchain pinned in
  # lean/lean-toolchain). #441, cop ruling: Lean is NEVER installed on a shared runner. It runs
  # INSIDE the sovereign-ci image, and elan installs into that ephemeral container, which is
  # discarded after the job. The per-run install goes away when the image carries elan
  # (paiml/infra#966). `lake build` warns `declaration uses 'sorry'` for the unproven theorems,
  # which is expected; the regression signal is the exit code.
  lean-gate:
    name: Lean Gate
    runs-on: [self-hosted, Linux, clean-room]
    container:
      image: localhost:5000/sovereign-ci:stable@sha256:70f2cdc9e537fe4447306d33c317fea33017f78f1ffa3b7af99095391419ef36
      options: --cpus 8
    steps:
      - name: Pre-checkout ownership restore (EACCES self-heal, copied from sovereign-ci)
        run: |
          set -u
          WORK_ROOT="$(dirname "${RUNNER_WORKSPACE:-$GITHUB_WORKSPACE}")"
          if [ "$WORK_ROOT" != "$(dirname "${RUNNER_TEMP:-/dev/null}")" ] || [ ! -d "$WORK_ROOT" ]; then
            WORK_ROOT="$(dirname "$GITHUB_WORKSPACE")"
          fi
          chown -R 1000:1000 "$WORK_ROOT" 2>/dev/null || true
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install elan inside the job container (never on the host, #441)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Lean toolchain check
        working-directory: lean
        run: lean --version
      - uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lean-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml') }}
      - name: Build Lean theorem scaffold
        working-directory: lean
        run: lake build

  # Kani gate: X64 only, because the pool includes ARM64 (gx10) and this Kani release's
  # aarch64-Linux support is unproven. Kani installs into the ephemeral job container, never
  # the host (#441, paiml/infra#966).
  kani-gate:
    name: Kani Gate
    runs-on: [self-hosted, Linux, X64, clean-room]
    container:
      image: localhost:5000/sovereign-ci:stable@sha256:70f2cdc9e537fe4447306d33c317fea33017f78f1ffa3b7af99095391419ef36
      options: --cpus 8
    steps:
      - name: Pre-checkout ownership restore (EACCES self-heal, copied from sovereign-ci)
        run: |
          set -u
          WORK_ROOT="$(dirname "${RUNNER_WORKSPACE:-$GITHUB_WORKSPACE}")"
          if [ "$WORK_ROOT" != "$(dirname "${RUNNER_TEMP:-/dev/null}")" ] || [ ! -d "$WORK_ROOT" ]; then
            WORK_ROOT="$(dirname "$GITHUB_WORKSPACE")"
          fi
          chown -R 1000:1000 "$WORK_ROOT" 2>/dev/null || true
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Kani 0.67.0 inside the job container (never on the host, #441)
        run: |
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup
          cargo kani --version
      - name: Run Kani harnesses
        working-directory: kani
        run: cargo kani

  # The org ruleset requires a context literally named `gate`; it aggregates the three gates
  # and refuses to pass on a shrunken denominator.
  gate:
    name: gate
    runs-on: [self-hosted, Linux, clean-room]
    needs: [ci, lean-gate, kani-gate]
    if: always()
    steps:
      - name: Aggregate upstream gate outcomes
        run: |
          set -euo pipefail
          checked=0
          failed=0
          while IFS='=' read -r job result; do
            [ -n "$job" ] || continue
            checked=$((checked + 1))
            if [ "$result" = "success" ]; then
              echo "PASS  $job"
            else
              echo "FAIL  $job: ${result:-<no result reported>}"
              failed=$((failed + 1))
            fi
          done <<EOF
          ci=${{ needs.ci.result }}
          lean-gate=${{ needs.lean-gate.result }}
          kani-gate=${{ needs.kani-gate.result }}
          EOF
          echo "checked $checked upstream job(s), $failed failing"
          if [ "$checked" -ne 3 ]; then
            echo "gate observed $checked of the 3 jobs it declares in needs: -- refusing to report green"
            exit 1
          fi
          [ "$failed" -eq 0 ]

  # Branch protection on `main` requires the context `CI Status`. Its name must never change,
  # or every PR blocks on a check nobody produces. It mirrors `gate`.
  ci-status:
    name: CI Status
    runs-on: [self-hosted, Linux, clean-room]
    needs: [gate]
    if: always()
    steps:
      - name: Report the aggregate gate outcome
        run: |
          r="${{ needs.gate.result }}"
          echo "gate: ${r:-<no result reported>}"
          [ "$r" = "success" ]
