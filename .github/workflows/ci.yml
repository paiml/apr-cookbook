# CI — lint, test, coverage, security, and unified gate
name: CI

on:
  pull_request_target:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable]
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request_target defaults to checking out the base branch (main),
          # which means CI would lint/test the pre-PR code and pass/fail on bugs
          # that have nothing to do with the PR. Pin to the PR head SHA so the
          # gate actually evaluates the PR's changes.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Coverage (codecov)
        run: |
          cargo install cargo-llvm-cov --locked || true
          cargo llvm-cov --all-features --lcov --output-path lcov.info
        continue-on-error: true

      - name: Security scan (cargo audit)
        run: |
          cargo install cargo-audit --locked || true
          cargo audit
        continue-on-error: true

  # The `unified` gate runs on paiml's self-hosted `clean-room` runners and
  # invokes a Makefile in the private `paiml/infra` repo. When that infra is
  # in a clean state it layers fmt/clippy/deny/sccache on top of the local
  # Quality Gate above. When it's not (e.g. a missing binary on the runner
  # returns 127 at `_provision`), it was historically blocking merges.
  #
  # Policy: the `Quality Gate` job above is the source of truth for
  # correctness — it's reproducible on any `ubuntu-latest` runner and
  # mirrors `cargo clippy` + `cargo test --all-features` exactly. The
  # unified gate adds signal but must not block when its own infrastructure
  # regresses. Until the infra repo's `_provision` target is fixed, this
  # remains advisory.
  unified:
    uses: paiml/.github/.github/workflows/unified-gate.yml@b6c24635217fe302ca1a67352b7de540fb3e02e7
    with:
      repo: ${{ github.event.repository.name }}
      pr_sha: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit

  # Lean gate — builds the ProvableContracts Lake project under `lean/`.
  # Catches regressions in the PMAT-047 theorem scaffold (e.g. a theorem
  # body stops compiling, or the lakefile/module graph drifts). Uses elan
  # to install the toolchain pinned in `lean/lean-toolchain`.
  #
  # Note: `lake build` emits `declaration uses 'sorry'` warnings for the
  # 16 unproven theorems — that's expected and honest. We don't fail on
  # warnings here; the real regression signal is the build exit code.
  lean-gate:
    name: Lean Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install elan (Lean toolchain manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | \
            sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Lean toolchain check
        working-directory: lean
        run: lean --version

      - uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lakefile.toml') }}

      - name: Build Lean theorem scaffold
        working-directory: lean
        run: lake build

  # Summary job that reports GREEN if the local Quality Gate + Lean Gate passed,
  # regardless of the self-hosted unified gate's health. Branch protection
  # should require this job — not `unified`.
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [gate, lean-gate]
    if: always()
    steps:
      - name: Report local quality + lean gate outcomes
        run: |
          failed=0
          for result_name in gate lean-gate; do
            case "$result_name" in
              gate)      r="${{ needs.gate.result }}" ;;
              lean-gate) r="${{ needs.lean-gate.result }}" ;;
            esac
            if [ "$r" = "success" ]; then
              echo "✅ $result_name: success"
            else
              echo "❌ $result_name: $r"
              failed=1
            fi
          done
          exit $failed
