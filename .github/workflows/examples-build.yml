# Examples Build — weekly cron + manual dispatch
# Verifies all 1670 examples compile clean. Lifted off the PR critical path
# (PMAT-328) because each debug-mode example is ~264MB; the full set needs
# >400GB target/ and exhausts GH-hosted runner disk (~14GB). Quality Gate
# runs only `cargo test --lib --tests` for fast PR feedback.
#
# When this gate fails, surface the breakage as an issue and address in a
# follow-up PR. Until aprender#1599 (dep duplication) is fixed upstream,
# even the weekly run may need disk-pressure mitigation.
name: Examples Build

on:
  schedule:
    # Sundays at 06:00 UTC (after Coverage cron)
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  build-examples:
    name: cargo build --examples (weekly)
    # #441: off hosted ubuntu-latest. Inside the sovereign-ci image on the fleet pool, so no
    # free-disk-space step (it deletes host toolchains on a shared runner) and no host
    # toolchain; the target dir lives in the ephemeral container. Same command as before.
    runs-on: [self-hosted, Linux, clean-room]
    container:
      image: localhost:5000/sovereign-ci:stable@sha256:70f2cdc9e537fe4447306d33c317fea33017f78f1ffa3b7af99095391419ef36
      options: --cpus 8
    steps:
      - name: Pre-checkout ownership restore (EACCES self-heal, copied from sovereign-ci)
        run: |
          set -u
          WORK_ROOT="$(dirname "${RUNNER_WORKSPACE:-$GITHUB_WORKSPACE}")"
          if [ "$WORK_ROOT" != "$(dirname "${RUNNER_TEMP:-/dev/null}")" ] || [ ! -d "$WORK_ROOT" ]; then
            WORK_ROOT="$(dirname "$GITHUB_WORKSPACE")"
          fi
          chown -R 1000:1000 "$WORK_ROOT" 2>/dev/null || true
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Build all examples (release mode for smaller binaries)
        run: cargo build --examples --release --all-features
