name: Architecture Demos

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'docs/specifications/architecture-demos/**'
      - 'docs/specifications/architecture-demos.md'
      - 'examples/inference/inference_*_smoke.rs'
      - 'contracts/inference-*-smoke-v1.yaml'
      - 'scripts/architecture-demos-gen.sh'
      - 'Cargo.toml'
  push:
    branches: [main, master]
    paths:
      - 'docs/specifications/architecture-demos/**'
      - 'docs/specifications/architecture-demos.md'
      - 'examples/inference/inference_*_smoke.rs'
      - 'contracts/inference-*-smoke-v1.yaml'
      - 'scripts/architecture-demos-gen.sh'
      - 'Cargo.toml'
  workflow_dispatch:

jobs:
  architecture-demos-coverage:
    name: Verify architecture-demos manifest is in sync
    runs-on: [self-hosted, Linux, clean-room]   # fleet clean-room pool, arch-neutral (#441)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install yq (job-local, arch-aware; no sudo on a shared runner, #441)
        run: |
          case "$(uname -m)" in x86_64) a=amd64 ;; aarch64|arm64) a=arm64 ;; *) echo "unsupported arch $(uname -m)"; exit 1 ;; esac
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/yq" "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${a}"
          chmod +x "$RUNNER_TEMP/bin/yq"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/yq" --version

      - name: Install pv (aprender-contracts-cli)
        # job-local install root: never into the shared runner's CARGO_HOME (#441)
        run: |
          cargo install --locked --root "$RUNNER_TEMP/pv" aprender-contracts-cli
          echo "$RUNNER_TEMP/pv/bin" >> "$GITHUB_PATH"

      - name: Architecture-demos manifest reconciliation
        run: bash scripts/architecture-demos-gen.sh --check

      - name: Lint all contracts (includes architecture-demos stubs)
        run: pv lint contracts/
