# Popperian Falsification Tests
# Following Karl Popper's criterion of demarcation - all claims must be testable and refutable
# Reference: Popper, K. (1959). The Logic of Scientific Discovery.

name: Popperian Falsification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual runs for debugging
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  falsification:
    name: Falsification Tests (F1-F7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-falsification-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-falsification-

      - name: Run Falsification Tests (Debug)
        run: |
          echo "=== Popperian Falsification Tests (Debug Build) ==="
          echo "Note: Debug thresholds are relaxed; release thresholds are stricter"
          cargo test --test falsification -- --nocapture

      - name: Run Falsification Tests (Release)
        run: |
          echo "=== Popperian Falsification Tests (Release Build) ==="
          echo "Testing against production performance thresholds"
          cargo test --test falsification --release -- --nocapture

  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Run Criterion Benchmarks
        run: |
          echo "=== Performance Benchmarks ==="
          cargo bench --bench inference 2>&1 || echo "Benchmark complete (some may be skipped)"

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: target/criterion
          retention-days: 30

  simd-detection:
    name: SIMD Capability Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Detect CPU Features
        run: |
          echo "=== CPU Feature Detection ==="
          cat /proc/cpuinfo | grep -E "^(model name|flags)" | head -10
          echo ""
          echo "=== Rust Target Features ==="
          rustc --print cfg | grep target_feature || echo "No target features detected"
          echo ""
          echo "=== SIMD Capabilities for Falsification Claims ==="
          if grep -q avx512 /proc/cpuinfo; then
            echo "F7: AVX-512 detected - 80 GFLOPS claim testable"
          elif grep -q avx2 /proc/cpuinfo; then
            echo "F7: AVX2 detected - ~40 GFLOPS expected"
          else
            echo "F7: Basic SIMD only - scalar baseline"
          fi
