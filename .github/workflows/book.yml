# Book — build mdBook and deploy to GitHub Pages.
#
# Uses the modern `actions/deploy-pages` path (artifact upload) to match
# the repo's Pages config (`build_type: workflow`). The previous
# `peaceiris/actions-gh-pages` flow pushed to a `gh-pages` branch, which
# Pages no longer serves from — that's why the site was 404.

name: mdBook CI

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - '.github/workflows/book.yml'
  pull_request:
    branches: [main]
    paths:
      - 'book/**'
      - '.github/workflows/book.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build book
    runs-on: [self-hosted, Linux, clean-room]   # fleet clean-room pool, arch-neutral (#441)
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          # job-local and arch-aware: the clean-room pool includes ARM64 (gx10), and ~/bin is shared (#441)
          case "$(uname -m)" in x86_64) t=x86_64-unknown-linux-gnu ;; aarch64|arm64) t=aarch64-unknown-linux-musl ;; *) echo "unsupported arch $(uname -m)"; exit 1 ;; esac
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v0.4.36/mdbook-v0.4.36-${t}.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build book
        run: |
          cd book
          mdbook build

      - name: Verify book structure
        run: |
          test -f book/book/index.html
          test -f book/book/print.html

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./book/book

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: [self-hosted, Linux, clean-room]   # fleet clean-room pool, arch-neutral (#441)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
