name: Runner Guard
# #441: no job may run on a GitHub-hosted runner (fleet rule). The not-yet-migrated jobs live
# in .github/hosted-runner-baseline.txt, a ratchet that only shrinks; the guard fails a new
# hosted job AND a stale baseline row.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
      - 'scripts/check_no_hosted_runners.sh'
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'scripts/check_no_hosted_runners.sh'
  workflow_dispatch:
jobs:
  no-hosted-runners:
    name: No hosted runners (ratchet)
    runs-on: [self-hosted, Linux, clean-room]   # fleet clean-room pool, arch-neutral (#441)
    steps:
      - uses: actions/checkout@v4
      - name: Guard case table (must-RED rows)
        run: bash scripts/check_no_hosted_runners.sh --self-test
      - name: No new hosted job, no stale baseline row
        run: bash scripts/check_no_hosted_runners.sh
