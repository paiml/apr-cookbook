name: Recipe Table

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'Cargo.toml'
      - 'examples/**'
      - 'README.md'
      - 'scripts/generate-recipe-table.sh'
  push:
    branches: [main, master]
    paths:
      - 'Cargo.toml'
      - 'examples/**'
      - 'README.md'
      - 'scripts/generate-recipe-table.sh'
  workflow_dispatch:

jobs:
  check-recipe-table:
    name: Verify recipe table is deterministic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify recipe table matches source
        run: ./scripts/generate-recipe-table.sh --check
