schema: cookbook-recipe/v1
id: run-moe-cuda-qwen3-30b-a3b
title: Run a mixture-of-experts model (Qwen3-30B-A3B) on the GPU
argv: ["apr", "run", "{model:main}", "--gpu", "--prompt", "What is 2+2? Answer with the number only.",
       "--max-tokens", "16", "--temperature", "0", "--json"]
models:
  main:
    role: model
    ref: "hf://unsloth/Qwen3-30B-A3B-Instruct-2507-GGUF/Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf"   # sha256 == this file's Hugging Face LFS oid (checked 2026-09-24)
    sha256: "6c997b8af17debdfb01d890214400ccbab00db6acc0ba8da5de1cc906c4774d0"
inputs: []
expect:
  exit: 0
  stdout_contains: ["4"]
  stdout_json: {"/backend/ran": "gpu", "/backend/fell_back": false}
min_apr: "0.69.1"
hosts: ["lambda", "gx10"]
backends: ["cuda"]
