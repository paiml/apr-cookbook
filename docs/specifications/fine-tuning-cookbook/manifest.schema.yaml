# Fine-Tuning Cookbook Manifest Schema
# Version: 1.0.0
# Modeled on architecture-demos/manifest.schema.yaml; simplified to drop
# per-checkpoint matrix concerns and add fine-tuning-specific fields.

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://paiml.com/schemas/fine-tuning-cookbook-manifest.schema.yaml"
title: "Fine-Tuning Cookbook Manifest"
description: "Schema for apr-cookbook fine-tuning recipe manifest entries"

type: object
required:
  - version
  - schema
  - last_updated
  - recipes

properties:
  version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
  schema:
    type: string
  last_updated:
    type: string
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"

  summary:
    type: object
    description: "Auto-regenerated counts; do not hand-edit"
    properties:
      total: { type: integer, minimum: 0 }
      certified: { type: integer, minimum: 0 }
      planned: { type: integer, minimum: 0 }
      tier_1: { type: integer, minimum: 0 }
      tier_2: { type: integer, minimum: 0 }
      tier_3: { type: integer, minimum: 0 }
      tier_4: { type: integer, minimum: 0 }
      ludwig_mirrored: { type: integer, minimum: 0 }
      unsloth_mirrored: { type: integer, minimum: 0 }

  recipes:
    type: array
    minItems: 1
    items: { $ref: "#/$defs/recipe" }

$defs:
  recipe:
    type: object
    required:
      - id
      - tier
      - technique
      - base_family
      - apr_subcommand
      - status
    properties:
      id:
        type: string
        pattern: "^t[1-4]_[a-z0-9_]+$"
        description: "Recipe id, used as filename prefix. e.g. t1_sft_minimal_llama"

      tier:
        type: integer
        enum: [1, 2, 3, 4]

      technique:
        type: string
        enum:
          - sft               # supervised fine-tuning
          - eval              # eval-only, no training
          - tabular_regression
          - tabular_classification
          - smoke             # plan/dry-run/resume/early-stop variants
          - lora
          - qlora
          - continued_pretrain
          - adapter_merge     # TIES, DARE, SLERP, average
          - instruction_tune
          - hyperopt
          - calibration
          - imbalance
          - multimodal
          - kfold_cv
          - dpo
          - orpo
          - kto
          - grpo
          - rlhf_ppo
          - rlaif
          - reward_modeling

      base_family:
        type: string
        description: "One of the 18 architecture-demos certified families, or 'cross-family' / 'tabular-only'"

      apr_subcommand:
        type: array
        minItems: 1
        items:
          type: string
          enum:
            - finetune
            - eval
            - quantize
            - serve
            - merge
            - distill
            - prune
            - chat
            - tune
            - bench
            - run
            - oracle
            - explain

      status:
        type: string
        enum: [planned, in-progress, certified, blocked]
        default: planned

      ludwig_mirror:
        type: string
        description: "Path or name of the Ludwig example this recipe mirrors. Optional — but at least 50 recipes must set this per Invariant L."

      unsloth_mirror:
        type: string
        description: "Path or name of the Unsloth notebook this recipe mirrors. Optional — same constraint as ludwig_mirror."

      apr_native:
        type: boolean
        default: false
        description: "true when the recipe has no Ludwig/Unsloth equivalent and is apr-specific (e.g., apr quantize, apr oracle)"

      recipe_path:
        type: string
        pattern: "^examples/finetune/t[1-4]_[a-z0-9_]+\\.rs$"
        description: "Required for status != planned"

      provable_contract:
        type: string
        pattern: "^contracts/finetune-t[1-4]-[a-z0-9-]+-v\\d+\\.yaml$"
        description: "Required for status: certified"

      falsifier:
        type: string
        description: "One-line description of the falsifiable claim (e.g., 'training loss decreases monotonically over first 10 steps on convex objective')"

      fixture_path:
        type: string
        pattern: "^tests/fixtures/finetune/[a-z0-9_-]+/.+$"
        description: "Path to bundled synthetic dataset; required for status: certified"

      cpu_smoke_seconds:
        type: number
        description: "Expected CPU smoke runtime; CI fails if recipe exceeds 60s on 1 CPU"
        maximum: 60

      gpu_required:
        type: boolean
        default: false
        description: "If true, recipe is gated behind --features cuda and skipped in default CI"

    allOf:
      - if:
          properties:
            status: { const: certified }
        then:
          required: [recipe_path, provable_contract, fixture_path, falsifier]

additionalProperties: false
