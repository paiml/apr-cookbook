[package]
name = "apr-cookbook"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Idiomatic Rust examples for the APR ML format - Toyota Way principles"
repository = "https://github.com/paiml/apr-cookbook"
keywords = ["machine-learning", "wasm", "apr", "ml-models", "rust"]
categories = ["science", "wasm", "development-tools"]
exclude = ["book/", "docs/", ".github/", ".pmat/", "tests/", "benches/", "target/", "proptest-regressions/", ".vscode/", ".idea/"]

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
unused_variables = "warn"
dead_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
similar_names = "allow"
many_single_char_names = "allow"
doc_markdown = "allow"
unreadable_literal = "allow"
uninlined_format_args = "allow"
unnecessary_wraps = "allow"
unnecessary_debug_formatting = "allow"
items_after_statements = "allow"
disallowed_methods = "allow"
unused_self = "allow"
match_same_arms = "allow"
struct_field_names = "allow"
too_many_arguments = "allow"
assigning_clones = "allow"
format_push_string = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
enum_variant_names = "allow"
no_effect_underscore_binding = "allow"
# Allowed for migrated alimentar examples (PMAT-066 centralize-cookbooks).
# These match style decisions in the upstream alimentar repo where the examples
# originated — flipping them would require touching every migrated file.
cast_lossless = "allow"
float_cmp = "allow"
for_kv_map = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[dependencies]
# APR-MONO v0.31.2 — canonical crate names from crates.io.
# Root `aprender` facade doesn't forward features, so depend on aprender-core
# (whose lib name is "aprender") with a package rename. Same trick the monorepo uses.
# For local co-development with ../aprender, uncomment [patch.crates-io] below.
aprender = { version = "0.31.2", package = "aprender-core", features = ["format-compression"] }
aprender-compute = "0.31.2"   # package `aprender-compute`, lib name `trueno`
aprender-train = "0.31.2"     # package `aprender-train`, lib name `entrenar`
ndarray = "0.16"  # For aprender-train Tensor gradients

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML parsing for deployment-stack recipe wrappers (PMAT-065)
serde_yaml = "0.9"

# Error handling
thiserror = "1"

# Recipe infrastructure
rand = { version = "0.8", features = ["std_rng"] }
tempfile = "3"

# Compression (for Lambda packaging)
flate2 = "1"

# Hashing (for deterministic seeds)
blake3 = "1"
lz4_flex = "0.11.3"
zstd = "0.13.3"
ed25519-dalek = "2.1.1"
# Rayon for the MoE dispatch parallelism bench (PMAT-085)
rayon = "1.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Performance", "Window", "console"] }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
lz4_flex = "0.11.3"
ed25519-dalek = "2.1.1"
zstd = "0.13.3"
# F2 zero-copy mmap falsification
memmap2 = "0.9"
# In-process contract validation (replaces external `pv` dependency)
# package `aprender-contracts`, lib name `provable_contracts`
aprender-contracts = "0.31.2"
# Data loading (PMAT-066 centralize-cookbooks: ex-alimentar examples)
# package `aprender-data`, lib name `alimentar` — use directly, no deprecation shim
alimentar = { version = "0.31.2", package = "aprender-data", features = ["doctest"] }
arrow = { version = "57", default-features = false, features = ["prettyprint", "ipc"] }
# Note: serde_yaml moved to [dependencies] by PMAT-065 (validate_recipe in lib);
# PMAT-067's visualization validator uses the same dep transitively.

# Sister crates (PMAT-073 expand-cookbooks: 6 crates, 18 recipes minimum).
# Lib names differ from package names — see subcrate-coverage.md for usage.
aprender-mcp = "0.31.2"               # lib `aprender_mcp`
aprender-tsp = "0.31.2"               # lib `aprender_tsp`
aprender-shell = "0.31.2"             # lib `aprender_shell`
aprender-monte-carlo = "0.31.2"       # lib `aprender_monte_carlo`
aprender-cgp = "0.31.2"               # lib `cgp` (CUDA feature opt-in via local cargo features)
aprender-contracts-macros = "0.31.2"  # lib `provable_contracts_macros` (proc-macro)

# ---------------------------------------------------------------------------
# Local-development patch: point the four APR-MONO deps at a co-checked-out
# ../aprender monorepo instead of the crates.io-published versions. Uncomment
# the block below when iterating on both repos simultaneously. Commented by
# default so CI and external users resolve straight from crates.io.
# ---------------------------------------------------------------------------
# [patch.crates-io]
# aprender-core = { path = "../aprender/crates/aprender-core" }
# aprender-compute = { path = "../aprender/crates/aprender-compute" }
# aprender-train = { path = "../aprender/crates/aprender-train" }
# aprender-contracts = { path = "../aprender/crates/aprender-contracts" }

[features]
default = ["doctest"]
encryption = ["aprender/format-encryption"]
# doctest enables alimentar's doctest module (used by prose_detection example).
# In default by design — the cookbook always wants alimentar's full surface.
doctest = []
# Empty marker features for alimentar example cfg() guards. The examples were
# written against an alimentar Cargo with optional `shuffle` and `repl` features.
# Cookbook always builds them in, so the cfg gates are no-ops here.
shuffle = []
repl = []
full = ["encryption"]

