metadata:
  version: "1.0.0"
  created: "2026-04-05"
  author: "PAIML Engineering"
  description: "1:1 parity invariant — every apr-cli subcommand and variant maps to a cookbook recipe + provable contract + Lean proof"
  references:
    - "APR Cookbook Spec v3.4.0, CLI Parity Invariant"
    - "paiml/apr-cli (58 subcommands, ~400 variants)"
  depends_on:
    - "recipe-iiur-v1"
  registry: false
  tags:
    - cli
    - parity
    - coverage

kernel_structure:
  phases:
    - name: "enumerate_subcommands"
      description: "Parse `apr --help` output; extract subcommand list S = {s_1, ..., s_n}"
      invariant: "|S| >= 58 (matches apr-cli published subcommand count)"
    - name: "scan_recipes"
      description: "Walk examples/**/*.rs; extract `CLI Equivalent: apr <cmd>` doc comments into R"
      invariant: "Every recipe r ∈ R has non-empty doc_comment and contracts reference"
    - name: "match_coverage"
      description: "Compute S \\ π(R) (subcommands without a recipe) and π(R) \\ S (orphan recipes)"
      invariant: "missing == ∅ && orphans == ∅"
    - name: "lean_status_check"
      description: "For each bound contract, query `pv lean-status` and assert level >= L2"
      invariant: "lean_level >= 2 for all contracts with obligation count > 0"

equations:
  subcommand_coverage:
    formula: "∀ s ∈ apr.subcommands: ∃ r ∈ recipes: r.cli_equivalent = s"
    domain: "s: String (apr --help subcommand)"
    codomain: "recipe: examples/<category>/<name>.rs"
    invariants:
      - "Every apr subcommand from `apr --help` has ≥1 cookbook recipe"
      - "Recipe doc comment contains `CLI Equivalent: apr <subcommand>`"
      - "No orphan recipes (recipes without an apr counterpart must be flagged)"
    preconditions:
      - "!apr_subcommands.is_empty()"
      - "std::path::Path::new(\"examples\").is_dir()"
      - "apr_subcommands.iter().all(|s| !s.is_empty())"
    postconditions:
      - "missing_subcommands.is_empty()"
      - "orphan_recipes.is_empty()"
      - "recipes.iter().all(|r| r.doc_comment.contains(\"CLI Equivalent: apr\"))"
    lean_theorem: "Theorems.SubcommandCoverage"

  variant_coverage:
    formula: "∀ (s, f, v) ∈ apr.variants: ∃ r ∈ recipes: (s, f, v) ∈ r.demonstrates"
    domain: "(subcommand, flag, value) triple from `apr <sub> --help`"
    codomain: "recipe variant demonstration"
    invariants:
      - "Every documented flag of every subcommand has ≥1 recipe demonstrating it"
      - "Every non-trivial flag value (enum, strategy name) has a recipe"
      - "Recipes list demonstrated variants in their doc comment"
    preconditions:
      - "!apr_variants.is_empty()"
      - "apr_variants.iter().all(|(s, f, _)| !s.is_empty() && !f.is_empty())"
      - "!recipes.is_empty()"
    postconditions:
      - "uncovered_variants.is_empty()"
      - "variant_coverage_ratio >= 0.9"
      - "recipes.iter().all(|r| !r.demonstrates.is_empty())"
    lean_theorem: "Theorems.VariantCoverage"

  contract_binding:
    formula: "∀ r ∈ recipes: ∃ c ∈ contracts/: r.behavior ⊨ c.obligations"
    domain: "recipe function"
    codomain: "YAML contract obligations"
    invariants:
      - "Every recipe references ≥1 provable contract"
      - "Contract obligations are verified by the recipe's test assertions"
      - "pv lint passes for every referenced contract"
    preconditions:
      - "!recipes.is_empty()"
      - "std::path::Path::new(\"contracts\").is_dir()"
      - "recipes.iter().all(|r| !r.contracts.is_empty())"
    postconditions:
      - "recipes_without_contract.is_empty()"
      - "recipes.iter().all(|r| r.contracts.iter().all(|c| std::path::Path::new(c).exists()))"
      - "pv_lint_status == \"PASS\""
    lean_theorem: "Theorems.ContractBinding"

  lean_proof:
    formula: "∀ c ∈ contracts/: pv lean-status(c) ≥ L2"
    domain: "contract YAML file"
    codomain: "Lean 4 proof level (L1–L5)"
    invariants:
      - "Every contract has a Lean 4 proof at level L2 or higher"
      - "pv lean-status passes with no `sorry` in critical theorems"
    preconditions:
      - "std::path::Path::new(contract_path).exists()"
      - "contract_path.ends_with(\".yaml\")"
      - "!critical_theorems.is_empty()"
    postconditions:
      - "lean_level >= 2"
      - "lean_level <= 5"
      - "sorry_count_in_critical == 0"
    lean_theorem: "Theorems.LeanProof"

proof_obligations:
  - type: invariant
    property: "Subcommand coverage — no gaps"
    formal: "|{s ∈ apr.subcommands : ∄ recipe}| = 0"
    tolerance: 0.0
    applies_to: subcommand_coverage
    lean:
      theorem: "Theorems.SubcommandCoverageNoGaps"
      module: "ProvableContracts.Cli.Parity"
      status: wip
  - type: invariant
    property: "Variant coverage — every flag demonstrated"
    formal: "|{(s,f) : flag f of subcommand s has no recipe}| = 0"
    tolerance: 0.1
    applies_to: variant_coverage
    lean:
      theorem: "Theorems.VariantCoverageEveryFlagDemonstrated"
      module: "ProvableContracts.Cli.Parity"
      status: wip
  - type: invariant
    property: "No orphan recipes"
    formal: "∀ r: r.cli_equivalent ≠ ∅ ∧ r.cli_equivalent ∈ apr.subcommands"
    tolerance: 0.0
    applies_to: subcommand_coverage
    lean:
      theorem: "Theorems.NoOrphanRecipes"
      module: "ProvableContracts.Cli.Parity"
      status: wip
  - type: precondition
    property: "Contract binding exists"
    formal: "recipe.contracts ≠ ∅"
    tolerance: 0.0
    applies_to: contract_binding
    lean:
      theorem: "Theorems.ContractBindingExists"
      module: "ProvableContracts.Cli.Parity"
      status: wip
  - type: postcondition
    property: "Lean proof present"
    formal: "∀ c ∈ recipe.contracts: lean_status(c) ≥ 2"
    tolerance: 0.0
    applies_to: lean_proof
    lean:
      theorem: "Theorems.LeanProofPresent"
      module: "ProvableContracts.Cli.Parity"
      status: wip

falsification_tests:
  - id: FALSIFY-CLIPARITY-001
    rule: "Subcommand coverage"
    prediction: "Every apr subcommand has a recipe"
    test: "diff <(apr --help subcommands) <(grep -r 'CLI Equivalent: apr' examples/ | awk); assert empty"
    if_fails: "New subcommand added to apr without cookbook update"
  - id: FALSIFY-CLIPARITY-002
    rule: "Variant coverage"
    prediction: "Every flag of every subcommand has a demonstration"
    test: "For each subcommand s, for each flag f in `apr s --help`, grep recipes for `--f`"
    if_fails: "Flag added to apr without cookbook variant"
  - id: FALSIFY-CLIPARITY-003
    rule: "No orphan recipes"
    prediction: "Every recipe maps to an apr subcommand"
    test: "grep -r 'CLI Equivalent:' examples/ | awk; assert subset of apr --help"
    if_fails: "Recipe demonstrates a command that no longer exists in apr"
  - id: FALSIFY-CLIPARITY-004
    rule: "Contract binding"
    prediction: "Every recipe names ≥1 contract YAML"
    test: "For each recipe, check doc comment for 'Contract: contracts/*.yaml'"
    if_fails: "Recipe added without linking to a contract"
  - id: FALSIFY-CLIPARITY-005
    rule: "Lean proof"
    prediction: "Every bound contract has Lean proof ≥ L2"
    test: "pv lean-status contracts/ | assert all L2+"
    if_fails: "Contract added without Lean proof or regressed below L2"

kani_harnesses:
  - id: KANI-CLIPARITY-001
    obligation: "Subcommand coverage — no gaps"
    bound: 4
    strategy: bounded_int
    harness: "kani_harnesses::cliparity_subcommand_coverage"
  - id: KANI-CLIPARITY-002
    obligation: "Contract binding exists"
    bound: 4
    strategy: bounded_int
    harness: "kani_harnesses::cliparity_contract_binding_exists"
  - id: KANI-CLIPARITY-003
    obligation: "Variant coverage — every flag demonstrated"
    bound: 4
    strategy: compositional
    harness: "kani_harnesses::cliparity_variant_coverage"
  - id: KANI-CLIPARITY-004
    obligation: "No orphan recipes"
    bound: 4
    strategy: bounded_int
    harness: "kani_harnesses::cliparity_no_orphan_recipes"
  - id: KANI-CLIPARITY-005
    obligation: "Lean proof present"
    bound: 4
    strategy: bounded_int
    harness: "kani_harnesses::cliparity_lean_proof_present"

qa_gate:
  id: F-CLIPARITY-001
  name: "CLI Parity Invariant"
  description: "Every apr-cli subcommand and variant has a cookbook recipe + contract + Lean proof"
  checks:
    - "subcommand_coverage"
    - "variant_coverage"
    - "contract_binding"
    - "lean_proof"
  pass_criteria: "subcommand coverage = 100%, variant coverage ≥ 90%, all contracts pv lint PASS, all Lean proofs ≥ L2"
