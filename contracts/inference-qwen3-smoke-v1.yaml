metadata:
  version: "1.0.0"
  created: "2026-05-07"
  author: "PAIML Engineering"
  description: "Qwen3 smoke inference invariants — config parse, head_dim discriminator (vs Qwen2), deterministic forward simulation"
  references:
    - "Qwen Team (2025). Qwen3 Model Family. (HF model card)"
    - "docs/specifications/architecture-demos.md"
  depends_on:
    - "recipe-iiur-v1"
  tags:
    - architecture-demos
    - inference
    - smoke
    - qwen3

kernel_structure:
  phases:
    - name: setup
      description: "Construct RecipeContext; resolve fixture path"
      invariant: "context.temp_dir empty; fixture readable"
    - name: load
      description: "Read config.json; extract numeric fields"
      invariant: "Four numeric fields parsed; head_dim explicitly declared (Qwen3 vs Qwen2)"
    - name: forward
      description: "Run LCG seeded forward simulation"
      invariant: "head_dim seeds the accumulator so it influences checksum"
    - name: verify
      description: "Two consecutive smoke calls produce equal verdicts"
      invariant: "Determinism across runs"
    - name: teardown
      description: "Drop RecipeContext; verify temp_dir cleanup"
      invariant: "context.temp_dir cleaned up"

equations:
  loader_dispatch:
    formula: "smoke(fixture, fmt) ↦ Ok | LoaderUnavailable | InvalidFixture"
    domain: "fixture: Path; fmt: String"
    codomain: "SmokeVerdict"
    invariants:
      - "Family on Ok arm always 'qwen3'"
      - "Missing head_dim surfaces LoaderUnavailable (Qwen3 discriminator vs Qwen2)"
    preconditions:
      - "fixture is a valid UTF-8 path string"
      - "fmt ∈ {safetensors, apr, gguf}"
    postconditions:
      - "match Ok { family, head_dim, .. } => family == 'qwen3' AND head_dim == config.head_dim"
    lean_theorem: "Theorems.Qwen3.LoaderDispatch"
    tolerance: 0
    lean:
      theorem: "Theorems.Qwen3.LoaderDispatch"
      status: wip
      module: "lean/Theorems/Qwen3.lean"

  head_dim_discriminator:
    formula: "config without head_dim ↦ LoaderUnavailable"
    domain: "fixture: Path"
    codomain: "SmokeVerdict"
    invariants:
      - "Qwen3 explicitly declares head_dim; Qwen2 derives it from hidden_size/num_attention_heads"
    preconditions:
      - "fixture is readable"
    postconditions:
      - "if !body.contains('head_dim') then result is LoaderUnavailable"
    lean_theorem: "Theorems.Qwen3.HeadDimDiscriminator"
    tolerance: 0
    lean:
      theorem: "Theorems.Qwen3.HeadDimDiscriminator"
      status: wip
      module: "lean/Theorems/Qwen3.lean"

  forward_determinism:
    formula: "forward_sim(seed, vocab, hidden, head_dim) is deterministic and head_dim-sensitive"
    domain: "seed: u64; vocab,hidden,head_dim: u32"
    codomain: "u32"
    invariants:
      - "head_dim seeds the accumulator so it participates in output"
    preconditions:
      - "seed | 1 != 0"
    postconditions:
      - "forward_sim(s, v, h, hd) == forward_sim(s, v, h, hd)"
      - "forward_sim(42, 256, 64, 16) != forward_sim(42, 256, 64, 32)"
    lean_theorem: "Theorems.Qwen3.ForwardDeterminism"
    tolerance: 0
    lean:
      theorem: "Theorems.Qwen3.ForwardDeterminism"
      status: wip
      module: "lean/Theorems/Qwen3.lean"

proof_obligations:
  - type: invariant
    property: "Loader dispatch is total"
    formal: "for all fixture, fmt. smoke(fixture, fmt) ↦ SmokeVerdict"
    tolerance: 0.0
    applies_to: loader_dispatch
    lean:
      theorem: "Theorems.Qwen3.LoaderDispatch"
      module: "ProvableContracts.ArchitectureDemos.Qwen3"
  - type: invariant
    property: "head_dim presence is required"
    formal: "fixture without head_dim ↦ LoaderUnavailable"
    tolerance: 0.0
    applies_to: head_dim_discriminator
    lean:
      theorem: "Theorems.Qwen3.HeadDimDiscriminator"
      module: "ProvableContracts.ArchitectureDemos.Qwen3"
  - type: invariant
    property: "Forward simulation is head_dim-sensitive"
    formal: "head_dim participates in checksum"
    tolerance: 0.0
    applies_to: forward_determinism
    lean:
      theorem: "Theorems.Qwen3.ForwardDeterminism"
      module: "ProvableContracts.ArchitectureDemos.Qwen3"

falsification_tests:
  - id: FALSIFY-QWEN3-001
    rule: "head_dim is explicitly declared in Qwen3"
    prediction: "head_dim == 16 for the bundled Qwen3 fixture"
    test: "cargo test --example inference_qwen3_smoke -- happy_path_head_dim_present"
    if_fails: "head_dim extraction broke or fixture lost the field"
  - id: FALSIFY-QWEN3-002
    rule: "Forward simulation is head_dim-sensitive"
    prediction: "forward_sim with head_dim=16 != forward_sim with head_dim=32"
    test: "cargo test --example inference_qwen3_smoke -- head_dim_affects_checksum"
    if_fails: "head_dim dropped from accumulator seeding"
  - id: FALSIFY-QWEN3-003
    rule: "Forward simulation is deterministic per seed"
    prediction: "Same seed → same output; different seed → different output"
    test: "cargo test --example inference_qwen3_smoke -- forward_sim_deterministic_per_seed"
    if_fails: "Non-determinism leaked from RNG/threading"

kani_harnesses:
  - id: KANI-QWEN3-001
    obligation: "Deterministic verdict on equal inputs"
    bound: 4
    strategy: bounded_int
    harness: "kani_harnesses::qwen3_smoke_deterministic"
  - id: KANI-QWEN3-002
    obligation: "InvalidFixture is total"
    bound: 4
    strategy: bounded_int
    harness: "kani_harnesses::qwen3_smoke_invalid_fixture_total"
  - id: KANI-QWEN3-003
    obligation: "head_dim_present"
    bound: 4
    strategy: bounded_int
    harness: "kani_harnesses::qwen3_head_dim_present"

qa_gate:
  id: F-QWEN3-001
  name: "Qwen3 Smoke Inference Contract"
  description: "Smoke load + head_dim discriminator + deterministic forward simulation"
  checks:
    - "head_dim_present"
    - "head_dim_affects_checksum"
    - "forward_determinism"
  pass_criteria: "All three falsification tests pass"
