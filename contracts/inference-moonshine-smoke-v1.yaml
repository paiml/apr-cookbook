metadata:
  version: "1.0.0"
  created: "2026-05-07"
  author: "PAIML Engineering"
  description: "Moonshine smoke inference invariants — load, forward, determinism"
  references:
    - "Jeffries et al. (2024). Moonshine: Speech Recognition for Live Transcription and Voice Commands. (Useful Sensors tech report)"
    - "docs/specifications/architecture-demos.md"
  depends_on:
    - "recipe-iiur-v1"
  tags:
    - architecture-demos
    - inference
    - smoke
    - moonshine

kernel_structure:
  phases:
    - name: setup
      description: "Construct RecipeContext; verify fixture path exists"
      invariant: "context.temp_dir exists; fixture path is readable"
    - name: load
      description: "Dispatch aprender::rosetta loader for the moonshine family"
      invariant: "load_family('moonshine', fixture, fmt) returns Ok(Model)"
    - name: forward
      description: "Run a seeded forward pass through the loaded model"
      invariant: "model.forward_smoke(&[42; 4]) returns logits of expected shape"
    - name: verify
      description: "Compare verdicts across two consecutive smoke() calls"
      invariant: "smoke(f, fmt) == smoke(f, fmt) byte-for-byte"
    - name: teardown
      description: "Drop RecipeContext; verify temp_dir cleanup"
      invariant: "!context.temp_dir.exists() after Drop"

equations:
  loader_dispatch:
    formula: "load_family(family, fixture, fmt) ↦ Ok(Model)"
    domain: "family ∈ supported_families; fixture: Path; fmt ∈ {safetensors, apr, gguf}"
    codomain: "Result<Model, LoaderError>"
    invariants:
      - "Dispatch is deterministic in (family, fixture, fmt)"
      - "Returned Model.family() == family"
    preconditions:
      - "Path::new(fixture).exists()"
      - "fmt ∈ {safetensors, apr, gguf}"
    postconditions:
      - "Model.family() == 'moonshine'"
      - "Model.layer_count() == 2"
    lean_theorem: "ProvableContracts.ArchitectureDemos.Moonshine.LoaderDispatch"
    tolerance: 0
    lean:
      theorem: "ProvableContracts.ArchitectureDemos.Moonshine.LoaderDispatch"
      status: proved
      module: "lean/ProvableContracts/ArchitectureDemos/Moonshine.lean"

  tensor_validation:
    formula: "validate_tensor_names(model, expected) ↦ Ok(())"
    domain: "model: Model; expected: Vec<String>"
    codomain: "Result<(), ContractError>"
    invariants:
      - "All expected tensor names are present in the model"
      - "No unexpected tensor names appear"
    preconditions:
      - "model.layer_count() > 0"
      - "expected.len() > 0"
    postconditions:
      - "expected ⊆ model.tensor_names()"
    lean_theorem: "ProvableContracts.ArchitectureDemos.Moonshine.TensorValidation"
    tolerance: 0
    lean:
      theorem: "ProvableContracts.ArchitectureDemos.Moonshine.TensorValidation"
      status: proved
      module: "lean/ProvableContracts/ArchitectureDemos/Moonshine.lean"

  forward_determinism:
    formula: "smoke(f, fmt) == smoke(f, fmt)"
    domain: "f: Path; fmt: String"
    codomain: "SmokeVerdict"
    invariants:
      - "Two calls with identical inputs produce equal verdicts"
    preconditions:
      - "Path::new(f).exists()"
      - "rng_seed_for_smoke == 42"
    postconditions:
      - "logits_checksum_run_1 == logits_checksum_run_2"
    lean_theorem: "ProvableContracts.ArchitectureDemos.Moonshine.ForwardDeterminism"
    tolerance: 0
    lean:
      theorem: "ProvableContracts.ArchitectureDemos.Moonshine.ForwardDeterminism"
      status: proved
      module: "lean/ProvableContracts/ArchitectureDemos/Moonshine.lean"

falsification_tests:
  - id: FALSIFY-MOONSHINE-001
    rule: "Loader dispatches and returns correct family identifier"
    prediction: "load_family('moonshine', fixture, 'safetensors') ↦ Ok with .family() == 'moonshine'"
    test: "Run smoke('tests/fixtures/architectures/moonshine/model.safetensors', 'safetensors') and assert SmokeVerdict::Ok with matching family"
    if_fails: "Upstream rosetta loader misroutes or returns a different family identifier"
  - id: FALSIFY-MOONSHINE-002
    rule: "Forward pass is deterministic across two consecutive calls"
    prediction: "Identical inputs produce identical SmokeVerdict outputs"
    test: "Call smoke twice on the same fixture and assert byte-equal verdicts"
    if_fails: "Non-determinism leaked from RNG, threading, or uninitialized memory"
  - id: FALSIFY-MOONSHINE-003
    rule: "Missing fixture path returns InvalidFixture, not panic"
    prediction: "smoke('/no/such/path', 'safetensors') ↦ SmokeVerdict::InvalidFixture"
    test: "Pass a non-existent path and assert InvalidFixture variant"
    if_fails: "Loader panics on missing input instead of returning a clean verdict"

kani_harnesses:
  - id: KANI-MOONSHINE-001
    obligation: "Forward pass is deterministic"
    bound: 4
    strategy: bounded_int
    harness: "kani_harnesses::moonshine_smoke_deterministic"
  - id: KANI-MOONSHINE-002
    obligation: "Loader dispatch returns Ok for moonshine"
    bound: 4
    strategy: bounded_int
    harness: "kani_harnesses::moonshine_smoke_invalid_fixture_total"
  - id: KANI-MOONSHINE-003
    obligation: "Tensor names match expected layout"
    bound: 4
    strategy: bounded_int
    harness: "kani_harnesses::moonshine_smoke_forward_determinism"

proof_obligations:
  - type: invariant
    property: "Loader dispatch returns Ok for moonshine"
    formal: "load_family('moonshine', fixture, fmt) ↦ Ok(Model) where Model.family() == 'moonshine'"
    tolerance: 0.0
    applies_to: loader_dispatch
    lean:
      theorem: "ProvableContracts.ArchitectureDemos.Moonshine.LoaderDispatch"
      status: proved
      module: "ProvableContracts.ArchitectureDemos.Moonshine"
  - type: invariant
    property: "Tensor names match expected layout"
    formal: "validate_tensor_names(model, expected) ↦ Ok(())"
    tolerance: 0.0
    applies_to: tensor_validation
    lean:
      theorem: "ProvableContracts.ArchitectureDemos.Moonshine.TensorValidation"
      status: proved
      module: "ProvableContracts.ArchitectureDemos.Moonshine"
  - type: invariant
    property: "Forward pass is deterministic"
    formal: "smoke(f, fmt) == smoke(f, fmt)"
    tolerance: 0.0
    applies_to: forward_determinism
    lean:
      theorem: "ProvableContracts.ArchitectureDemos.Moonshine.ForwardDeterminism"
      status: proved
      module: "ProvableContracts.ArchitectureDemos.Moonshine"

qa_gate:
  id: F-MOONSHINE-001
  name: "Moonshine Smoke Inference Contract"
  description: "Smoke load + deterministic forward pass for the moonshine architecture family"
  checks:
    - "loader_dispatch_returns_ok"
    - "tensor_validation_passes"
    - "forward_determinism"
  pass_criteria: "All three falsification tests pass; SmokeVerdict is Ok across all declared formats"
