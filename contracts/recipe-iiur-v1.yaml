metadata:
  version: "1.0.0"
  created: "2026-04-05"
  author: "PAIML Engineering"
  description: "IIUR recipe invariants — Isolated, Idempotent, Useful, Reproducible"
  references:
    - "APR Cookbook Spec v3.0.0, IIUR Principles"
    - "Ohno (1988) Toyota Production System"
  depends_on: []
  registry: false
  tags:
    - recipe
    - quality
    - iiur

kernel_structure:
  phases:
    - name: "setup"
      description: "Construct RecipeContext, seed RNG from recipe name hash, allocate temp directory"
      invariant: "temp_dir exists and is empty; RNG seed = hash(recipe_name)"
    - name: "execute"
      description: "Run recipe body with RecipeContext; all writes go inside temp_dir"
      invariant: "No writes outside temp_dir; no env mutation; no wall-clock reads"
    - name: "verify"
      description: "Hash recipe output and compare to prior run output (idempotency check)"
      invariant: "output_run_1 == output_run_2 byte-for-byte"
    - name: "teardown"
      description: "Drop RecipeContext; temp_dir is removed; env snapshot matches pre-run"
      invariant: "!temp_dir.exists() && env_after == env_before"

equations:
  isolation:
    formula: "side_effects(recipe) = ∅"
    domain: "recipe: fn(RecipeContext) -> Result<()>"
    codomain: "{∅}"
    invariants:
      - "No files created outside RecipeContext temp directory"
      - "No environment variables modified"
      - "No global state mutated"
      - "Temp directory cleaned up on drop"
    preconditions:
      - "context.temp_dir().exists()"
      - "context.temp_dir().is_dir()"
      - "env_snapshot_before.len() > 0"
    postconditions:
      - "files_written_outside_temp.is_empty()"
      - "env_snapshot_after == env_snapshot_before"
      - "!context.temp_dir().exists()"
    lean_theorem: "Theorems.Isolation"

  idempotency:
    formula: "output(run_1) = output(run_2) for same recipe"
    domain: "recipe with deterministic RNG seed"
    codomain: "bytes"
    invariants:
      - "RecipeContext seeds RNG from recipe name hash"
      - "Sequential runs produce bitwise-identical output"
      - "No dependence on wall clock, PID, or hostname"
    preconditions:
      - "!recipe_name.is_empty()"
      - "context.rng_seed() == hash(recipe_name.as_bytes())"
      - "!recipe_reads_wall_clock(recipe_name)"
    postconditions:
      - "output_run_1 == output_run_2"
      - "output_run_1.len() == output_run_2.len()"
      - "!output_contains_nondeterminism(&output_run_1)"
    lean_theorem: "Theorems.Idempotency"

  reproducibility:
    formula: "output(machine_A) = output(machine_B) for same recipe + deps"
    domain: "same Cargo.lock, same MSRV, any supported platform"
    codomain: "bytes"
    invariants:
      - "Pinned dependencies via Cargo.lock"
      - "MSRV 1.75 enforced in CI"
      - "Platform-independent results (no platform-specific float ops)"
    preconditions:
      - "std::path::Path::new(\"Cargo.lock\").exists()"
      - "rustc_version::version().map(|v| v >= semver::Version::new(1, 75, 0)).unwrap_or(false)"
      - "[\"linux\", \"macos\"].contains(&std::env::consts::OS)"
    postconditions:
      - "output_machine_a == output_machine_b"
      - "hash_sha256(&output_machine_a) == hash_sha256(&output_machine_b)"
      - "!uses_platform_specific_float_ops(&recipe_source)"
    lean_theorem: "Theorems.Reproducibility"

proof_obligations:
  - type: invariant
    property: "Isolation — no side effects"
    formal: "Files outside temp dir unchanged after recipe execution"
    tolerance: 0.0
    applies_to: isolation
    lean:
      theorem: "Theorems.IsolationNoSideEffects"
      module: "ProvableContracts.Recipe.Iiur"
      status: proved
  - type: determinism
    property: "Idempotency — same output"
    formal: "run(recipe) = run(recipe) for all recipes"
    tolerance: 0.0
    applies_to: idempotency
    lean:
      theorem: "Theorems.IdempotencySameOutput"
      module: "ProvableContracts.Recipe.Iiur"
      status: proved
  - type: invariant
    property: "Cleanup — no temp leaks"
    formal: "temp_dir does not exist after RecipeContext drops"
    tolerance: 0.0
    applies_to: isolation
    lean:
      theorem: "Theorems.CleanupNoTempLeaks"
      module: "ProvableContracts.Recipe.Iiur"
      status: proved
  - type: equivalence
    property: "Cross-platform reproducibility"
    formal: "output(linux) = output(macos) for all recipes"
    tolerance: 0.0
    applies_to: reproducibility
    lean:
      theorem: "Theorems.CrossPlatformReproducibility"
      module: "ProvableContracts.Recipe.Iiur"
      status: proved

falsification_tests:
  - id: FALSIFY-IIUR-001
    rule: "Isolation"
    prediction: "No files outside temp dir after recipe run"
    test: "Snapshot filesystem before/after recipe, diff, assert empty"
    if_fails: "Recipe writes to CWD or home directory"
  - id: FALSIFY-IIUR-002
    rule: "Idempotency"
    prediction: "Two sequential runs produce identical output"
    test: "Run recipe twice, capture stdout, assert equal"
    if_fails: "RNG not seeded deterministically or timestamp in output"
  - id: FALSIFY-IIUR-003
    rule: "Cleanup"
    prediction: "Temp directory removed after RecipeContext drops"
    test: "Run recipe, check temp path does not exist after completion"
    if_fails: "Drop impl not called (panic before drop) or rmdir fails"
  - id: FALSIFY-IIUR-004
    rule: "Cross-platform"
    prediction: "Same output on Linux and macOS CI runners"
    test: "CI matrix runs same recipe on both, compare hashed output"
    if_fails: "Platform-specific float formatting or path separator in output"

kani_harnesses:
  - id: KANI-IIUR-001
    obligation: "Isolation — no side effects"
    bound: 4
    strategy: exhaustive
    harness: "kani_harnesses::iiur_isolation_no_side_effects"
  - id: KANI-IIUR-002
    obligation: "Cleanup — no temp leaks"
    bound: 4
    strategy: exhaustive
    harness: "kani_harnesses::iiur_cleanup_no_temp_leaks"
  - id: KANI-IIUR-003
    obligation: "Idempotency — same output"
    bound: 4
    strategy: bounded_int
    harness: "kani_harnesses::iiur_idempotency_same_output"
  - id: KANI-IIUR-004
    obligation: "Cross-platform reproducibility"
    bound: 4
    strategy: compositional
    harness: "kani_harnesses::iiur_cross_platform_reproducibility"

qa_gate:
  id: F-IIUR-001
  name: "Recipe IIUR Contract"
  description: "Recipe isolation, idempotency, and reproducibility quality gate"
  checks:
    - "isolation"
    - "idempotency"
    - "cleanup"
    - "cross_platform"
  pass_criteria: "All 4 IIUR properties hold for every recipe in the catalog"
