metadata:
  version: "1.0.0"
  created: "2026-05-07"
  author: "PAIML Engineering"
  description: "GPT-2 smoke inference invariants — config parse with short-name fields (n_embd/n_layer/n_head), deterministic forward simulation"
  references:
    - "Radford et al. (2019). Language Models are Unsupervised Multitask Learners. (OpenAI tech report)"
    - "docs/specifications/architecture-demos.md"
  depends_on:
    - "recipe-iiur-v1"
  tags:
    - architecture-demos
    - inference
    - smoke
    - gpt2

kernel_structure:
  phases:
    - name: setup
      description: "Construct RecipeContext; resolve fixture path"
      invariant: "context.temp_dir empty; fixture readable"
    - name: load
      description: "Read config.json; extract n_embd, n_layer, n_head, vocab_size"
      invariant: "All four short-name fields present (GPT-2 discriminator vs Llama)"
    - name: forward
      description: "Run LCG seeded forward simulation"
      invariant: "Iteration count = min(vocab_size, n_embd)"
    - name: verify
      description: "Determinism across runs"
      invariant: "Two consecutive smoke calls produce equal verdicts"
    - name: teardown
      description: "Drop RecipeContext"
      invariant: "context.temp_dir cleaned up"

equations:
  loader_dispatch:
    formula: "smoke(fixture, fmt) ↦ Ok | LoaderUnavailable | InvalidFixture"
    domain: "fixture: Path; fmt: String"
    codomain: "SmokeVerdict"
    invariants:
      - "Family on Ok arm always 'gpt2'"
      - "Missing n_embd surfaces LoaderUnavailable (GPT-2 short-name discriminator)"
    preconditions:
      - "fixture is a valid UTF-8 path string"
      - "fmt ∈ {safetensors, apr, gguf}"
    postconditions:
      - "match Ok { family, n_layer, n_embd, n_head, .. } => all match config"
    lean_theorem: "Theorems.Gpt2.LoaderDispatch"
    tolerance: 0
    lean:
      theorem: "Theorems.Gpt2.LoaderDispatch"
      status: wip
      module: "lean/Theorems/Gpt2.lean"

  short_name_convention:
    formula: "GPT-2 config uses n_embd, n_layer, n_head (not hidden_size, etc.)"
    domain: "fixture: Path"
    codomain: "SmokeVerdict"
    invariants:
      - "n_embd extraction is required; absence rejects the config"
    preconditions:
      - "fixture is readable"
    postconditions:
      - "if !body.contains('n_embd') then result is LoaderUnavailable"
    lean_theorem: "Theorems.Gpt2.ShortNameConvention"
    tolerance: 0
    lean:
      theorem: "Theorems.Gpt2.ShortNameConvention"
      status: wip
      module: "lean/Theorems/Gpt2.lean"

  forward_determinism:
    formula: "forward_sim(seed, vocab, n_embd) is deterministic and n_embd-sensitive"
    domain: "seed: u64; vocab,n_embd: u32"
    codomain: "u32"
    invariants:
      - "Iteration count depends on n_embd"
    preconditions:
      - "seed | 1 != 0"
    postconditions:
      - "forward_sim(s, v, e) == forward_sim(s, v, e)"
      - "forward_sim(42, 256, 32) != forward_sim(42, 256, 64)"
    lean_theorem: "Theorems.Gpt2.ForwardDeterminism"
    tolerance: 0
    lean:
      theorem: "Theorems.Gpt2.ForwardDeterminism"
      status: wip
      module: "lean/Theorems/Gpt2.lean"

proof_obligations:
  - type: invariant
    property: "Loader dispatch is total"
    formal: "for all fixture, fmt. smoke(fixture, fmt) ↦ SmokeVerdict"
    tolerance: 0.0
    applies_to: loader_dispatch
    lean:
      theorem: "Theorems.Gpt2.LoaderDispatch"
      module: "ProvableContracts.ArchitectureDemos.Gpt2"
  - type: invariant
    property: "n_embd extraction is required"
    formal: "fixture without n_embd ↦ LoaderUnavailable"
    tolerance: 0.0
    applies_to: short_name_convention
    lean:
      theorem: "Theorems.Gpt2.ShortNameConvention"
      module: "ProvableContracts.ArchitectureDemos.Gpt2"
  - type: invariant
    property: "Forward simulation is n_embd-sensitive"
    formal: "n_embd participates in iteration count"
    tolerance: 0.0
    applies_to: forward_determinism
    lean:
      theorem: "Theorems.Gpt2.ForwardDeterminism"
      module: "ProvableContracts.ArchitectureDemos.Gpt2"

falsification_tests:
  - id: FALSIFY-GPT2-001
    rule: "GPT-2 short-name fields are extracted"
    prediction: "n_layer=2, n_embd=64, n_head=4 for the bundled GPT-2 fixture"
    test: "cargo test --example inference_gpt2_smoke -- happy_path_short_field_names_present"
    if_fails: "Field name pattern drifted; perhaps using hidden_size instead"
  - id: FALSIFY-GPT2-002
    rule: "Forward simulation is n_embd-sensitive"
    prediction: "forward_sim with n_embd=32 != forward_sim with n_embd=64"
    test: "cargo test --example inference_gpt2_smoke -- n_embd_affects_iteration_count"
    if_fails: "n_embd dropped from iteration count"
  - id: FALSIFY-GPT2-003
    rule: "Forward simulation is deterministic per seed"
    prediction: "Same seed → same output"
    test: "cargo test --example inference_gpt2_smoke -- forward_sim_deterministic_per_seed"
    if_fails: "Non-determinism leaked"

kani_harnesses:
  - id: KANI-GPT2-001
    obligation: "Deterministic verdict on equal inputs"
    bound: 4
    strategy: bounded_int
    harness: "kani_harnesses::gpt2_smoke_deterministic"
  - id: KANI-GPT2-002
    obligation: "InvalidFixture is total"
    bound: 4
    strategy: bounded_int
    harness: "kani_harnesses::gpt2_smoke_invalid_fixture_total"

qa_gate:
  id: F-GPT2-001
  name: "GPT-2 Smoke Inference Contract"
  description: "Smoke load + short-name discriminator + deterministic forward simulation"
  checks:
    - "n_embd_present"
    - "n_embd_affects_checksum"
    - "forward_determinism"
  pass_criteria: "All three falsification tests pass"
