metadata:
  version: "1.0.0"
  created: "2026-04-05"
  author: "PAIML Engineering"
  description: "Zero-copy mmap model loading latency — F2 falsifiable claim"
  references:
    - "Kerrisk (2010) The Linux Programming Interface, Ch. 49: Memory Mappings"
    - "APR Cookbook Spec v3.0.0, Claim F2"
  depends_on:
    - "recipe-iiur-v1"
    - "apr-format-roundtrip-v1"
  tags:
    - performance
    - mmap
    - zero-copy

kernel_structure:
  phases:
    - name: "open_file"
      description: "Open .apr file with read-only flags; resolve inode via stat()"
      invariant: "fd >= 0 && Path::new(path).exists() && file_size > 0"
    - name: "mmap_region"
      description: "Call mmap(NULL, len, PROT_READ, MAP_PRIVATE, fd, 0) to map file into address space"
      invariant: "mmap returns non-MAP_FAILED pointer; no data copied; O(1) in file size"
    - name: "parse_header"
      description: "Read APR magic bytes and tensor directory from mapped region (pointer arithmetic only)"
      invariant: "No heap allocations; all tensors are slices into mmap region"
    - name: "first_access"
      description: "Page fault on first tensor read pulls page from storage into page cache"
      invariant: "Subsequent accesses to same page are served from page cache (no I/O)"

equations:
  mmap_latency:
    formula: "L = t_mmap_complete - t_mmap_start"
    domain: "file_size ∈ [1 MB, 100 GB], file exists on disk"
    codomain: "L ∈ [0, ∞) seconds"
    invariants:
      - "L < 1ms for any model size (F2 threshold) — mmap is O(1) in file size"
      - "L is independent of file size (only page table setup, no I/O)"
    preconditions:
      - "file_size_bytes >= 1_048_576"
      - "file_size_bytes <= 107_374_182_400"
      - "std::path::Path::new(path).exists()"
    postconditions:
      - "result_seconds >= 0.0"
      - "result_seconds < 0.001"
      - "result_seconds.is_finite()"
    lean_theorem: "Theorems.MmapLatency"

  first_access_latency:
    formula: "L_access = t_first_byte_read - t_mmap_complete"
    domain: "mmap'd region, page not yet faulted"
    codomain: "L_access ∈ [0, ∞) seconds"
    invariants:
      - "L_access depends on storage I/O (SSD: ~10µs, HDD: ~5ms)"
      - "Subsequent accesses to same page are L_cached ~ 0"
    preconditions:
      - "!mmap_region.is_empty()"
      - "offset < mmap_region.len()"
      - "!page_is_faulted(mmap_region, offset)"
    postconditions:
      - "result_seconds >= 0.0"
      - "result_seconds < 0.005"
      - "result_seconds.is_finite()"
    lean_theorem: "Theorems.FirstAccessLatency"

  zero_copy:
    formula: "allocations(mmap_load) = 0 heap allocations"
    domain: "any .apr model file"
    codomain: "{0}"
    invariants:
      - "No memcpy from kernel to userspace (data stays in page cache)"
      - "Tensor slices are pointer offsets into mmap'd region"
    preconditions:
      - "std::path::Path::new(path).exists()"
      - "path.ends_with(\".apr\")"
      - "std::fs::metadata(path).map(|m| m.len() > 0).unwrap_or(false)"
    postconditions:
      - "heap_allocation_count == 0"
      - "tensor_slices.iter().all(|t| mmap_region.as_ptr_range().contains(&t.as_ptr()))"
      - "!memcpy_observed_in_load_path"
    lean_theorem: "Theorems.ZeroCopy"

proof_obligations:
  - type: bound
    property: "mmap latency under 1ms"
    formal: "L < 0.001s for all model sizes"
    tolerance: 1.0e-4
    applies_to: mmap_latency
    lean:
      theorem: "Theorems.MmapLatencyUnder1Ms"
      module: "ProvableContracts.Mmap.Inference"
      status: wip
  - type: invariant
    property: "O(1) in file size"
    formal: "|L(100MB) - L(10GB)| < 0.5ms"
    tolerance: 5.0e-4
    applies_to: mmap_latency
    lean:
      theorem: "Theorems.O1InFileSize"
      module: "ProvableContracts.Mmap.Inference"
      status: wip
  - type: invariant
    property: "Zero heap allocations"
    formal: "allocations(mmap_load) = 0"
    tolerance: 0.0
    applies_to: zero_copy
    lean:
      theorem: "Theorems.ZeroHeapAllocations"
      module: "ProvableContracts.Mmap.Inference"
      status: wip

falsification_tests:
  - id: FALSIFY-MMAP-001
    rule: "F2 latency threshold"
    prediction: "mmap() call completes in < 1ms for a 1GB model"
    test: "Time mmap syscall on 1GB .apr file, 100 iterations, check p99 < 1ms"
    if_fails: "Kernel page table allocation contention or TLB pressure"
  - id: FALSIFY-MMAP-002
    rule: "Size independence"
    prediction: "|mmap_time(100MB) - mmap_time(10GB)| < 0.5ms"
    test: "Compare mmap latency on small vs large model files"
    if_fails: "mmap implementation is copying data or pre-faulting pages"
  - id: FALSIFY-MMAP-003
    rule: "Zero allocations"
    prediction: "No heap allocations during mmap model load"
    test: "Run under dhat/jemalloc profiler, assert 0 allocations in load path"
    if_fails: "Intermediate buffer or metadata copy in load path"

kani_harnesses:
  - id: KANI-MMAP-001
    obligation: "Zero heap allocations"
    bound: 4
    strategy: exhaustive
    harness: "kani_harnesses::mmap_zero_heap_allocations"
  - id: KANI-MMAP-002
    obligation: "mmap latency under 1ms"
    bound: 8
    strategy: stub_float
    harness: "kani_harnesses::mmap_latency_bound"
  - id: KANI-MMAP-003
    obligation: "O(1) in file size"
    bound: 8
    strategy: compositional
    harness: "kani_harnesses::mmap_o1_in_file_size"

qa_gate:
  id: F-MMAP-001
  name: "Zero-Copy Mmap Contract"
  description: "Model loading latency and zero-copy correctness quality gate"
  checks:
    - "latency_f2"
    - "size_independence"
    - "zero_allocations"
  pass_criteria: "p99 mmap latency < 1ms + 0 heap allocations"
