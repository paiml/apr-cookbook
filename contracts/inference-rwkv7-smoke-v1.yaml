metadata:
  version: "1.0.0"
  created: "2026-05-07"
  author: "PAIML Engineering"
  description: "RWKV-7 smoke inference invariants — config parse, linear-attention discriminator (time_mix_extra_dim + decay_low_rank_dim + wkv_dim), deterministic forward simulation"
  references:
    - "Peng et al. (2024). RWKV-7: Goose. arXiv:2404.05892"
    - "docs/specifications/architecture-demos.md"
  depends_on:
    - "recipe-iiur-v1"
  tags:
    - architecture-demos
    - inference
    - smoke
    - rwkv7
    - linear-attention

kernel_structure:
  phases:
    - name: setup
      description: "RecipeContext + fixture"
      invariant: "context.temp_dir empty; fixture readable"
    - name: load
      description: "Extract RWKV time-mix fields"
      invariant: "time_mix_extra_dim and wkv_dim parsed"
    - name: forward
      description: "LCG forward sim seeded with time_mix_extra_dim"
      invariant: "time_mix participates in checksum"
    - name: verify
      description: "Determinism"
      invariant: "Two consecutive smoke calls produce equal verdicts"
    - name: teardown
      description: "Drop RecipeContext"
      invariant: "context.temp_dir cleaned up"

equations:
  loader_dispatch:
    formula: "smoke(fixture, fmt) ↦ Ok | LoaderUnavailable | InvalidFixture"
    domain: "fixture: Path; fmt: String"
    codomain: "SmokeVerdict"
    invariants:
      - "Family on Ok arm always 'rwkv7'"
      - "Missing time_mix_extra_dim surfaces LoaderUnavailable"
    preconditions:
      - "fixture is a valid UTF-8 path string"
      - "fmt ∈ {safetensors, apr, gguf}"
    postconditions:
      - "match Ok { family, .. } => family == 'rwkv7'"
    lean_theorem: "Theorems.Rwkv7.LoaderDispatch"
    tolerance: 0
    lean:
      theorem: "Theorems.Rwkv7.LoaderDispatch"
      status: wip
      module: "lean/Theorems/Rwkv7.lean"

  linear_attention_discriminator:
    formula: "config without time_mix_extra_dim ↦ LoaderUnavailable"
    domain: "fixture: Path"
    codomain: "SmokeVerdict"
    invariants:
      - "RWKV-7 declares time-mix and WKV state fields; transformers do not"
    preconditions:
      - "fixture is readable"
    postconditions:
      - "match Ok { time_mix_extra_dim, wkv_dim, .. } => both match config"
    lean_theorem: "Theorems.Rwkv7.LinearAttentionDiscriminator"
    tolerance: 0
    lean:
      theorem: "Theorems.Rwkv7.LinearAttentionDiscriminator"
      status: wip
      module: "lean/Theorems/Rwkv7.lean"

  forward_determinism:
    formula: "forward_sim(seed, vocab, hidden, time_mix) is deterministic and time-mix-sensitive"
    domain: "seed: u64; vocab,hidden,time_mix: u32"
    codomain: "u32"
    invariants:
      - "time_mix seeds the accumulator"
    preconditions:
      - "seed | 1 != 0"
    postconditions:
      - "forward_sim(s, v, h, t) == forward_sim(s, v, h, t)"
      - "forward_sim(42, 256, 64, 32) != forward_sim(42, 256, 64, 64)"
    lean_theorem: "Theorems.Rwkv7.ForwardDeterminism"
    tolerance: 0
    lean:
      theorem: "Theorems.Rwkv7.ForwardDeterminism"
      status: wip
      module: "lean/Theorems/Rwkv7.lean"

proof_obligations:
  - type: invariant
    property: "Loader dispatch is total"
    formal: "for all fixture, fmt. smoke(fixture, fmt) ↦ SmokeVerdict"
    tolerance: 0.0
    applies_to: loader_dispatch
    lean:
      theorem: "Theorems.Rwkv7.LoaderDispatch"
      module: "ProvableContracts.ArchitectureDemos.Rwkv7"
  - type: invariant
    property: "time_mix_extra_dim required"
    formal: "fixture without time_mix_extra_dim ↦ LoaderUnavailable"
    tolerance: 0.0
    applies_to: linear_attention_discriminator
    lean:
      theorem: "Theorems.Rwkv7.LinearAttentionDiscriminator"
      module: "ProvableContracts.ArchitectureDemos.Rwkv7"
  - type: invariant
    property: "Forward simulation is time-mix-sensitive"
    formal: "time_mix participates in checksum"
    tolerance: 0.0
    applies_to: forward_determinism
    lean:
      theorem: "Theorems.Rwkv7.ForwardDeterminism"
      module: "ProvableContracts.ArchitectureDemos.Rwkv7"

falsification_tests:
  - id: FALSIFY-RWKV7-001
    rule: "RWKV time-mix fields are recognized"
    prediction: "time_mix_extra_dim=32, wkv_dim=64 for the bundled RWKV-7 fixture"
    test: "cargo test --example inference_rwkv7_smoke -- happy_path_rwkv_fields_present"
    if_fails: "Time-mix field detection broke"
  - id: FALSIFY-RWKV7-002
    rule: "Forward simulation is time-mix-sensitive"
    prediction: "forward_sim with time_mix=32 != forward_sim with 64"
    test: "cargo test --example inference_rwkv7_smoke -- time_mix_affects_checksum"
    if_fails: "time_mix dropped from accumulator"
  - id: FALSIFY-RWKV7-003
    rule: "Forward simulation is deterministic per seed"
    prediction: "Same seed → same output"
    test: "cargo test --example inference_rwkv7_smoke -- forward_sim_deterministic_per_seed"
    if_fails: "Non-determinism leaked"

kani_harnesses:
  - id: KANI-RWKV7-001
    obligation: "Deterministic verdict on equal inputs"
    bound: 4
    strategy: bounded_int
    harness: "kani_harnesses::rwkv7_smoke_deterministic"
  - id: KANI-RWKV7-002
    obligation: "InvalidFixture is total"
    bound: 4
    strategy: bounded_int
    harness: "kani_harnesses::rwkv7_smoke_invalid_fixture_total"
  - id: KANI-RWKV7-003
    obligation: "linear_attention_present"
    bound: 4
    strategy: bounded_int
    harness: "kani_harnesses::rwkv7_linear_attention_present"

qa_gate:
  id: F-RWKV7-001
  name: "RWKV-7 Smoke Inference Contract"
  description: "Smoke load + linear-attention discriminator + deterministic forward simulation"
  checks:
    - "rwkv_fields_present"
    - "time_mix_affects_checksum"
    - "forward_determinism"
  pass_criteria: "All three falsification tests pass"
