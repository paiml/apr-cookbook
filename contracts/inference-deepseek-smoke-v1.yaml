metadata:
  version: "1.0.0"
  created: "2026-05-07"
  author: "PAIML Engineering"
  description: "DeepSeek smoke inference invariants — config parse, MoE discriminator (n_routed_experts + num_experts_per_tok), deterministic forward simulation"
  references:
    - "DeepSeek-AI (2024). DeepSeek-V2. arXiv:2405.04434"
    - "docs/specifications/architecture-demos.md"
  depends_on:
    - "recipe-iiur-v1"
  tags:
    - architecture-demos
    - inference
    - smoke
    - deepseek
    - moe

kernel_structure:
  phases:
    - name: setup
      description: "RecipeContext + fixture path"
      invariant: "context.temp_dir empty; fixture readable"
    - name: load
      description: "Extract MoE fields"
      invariant: "Five numeric fields parsed including n_routed_experts and num_experts_per_tok"
    - name: forward
      description: "LCG forward sim seeded with n_routed_experts"
      invariant: "n_routed_experts participates in checksum"
    - name: verify
      description: "Determinism"
      invariant: "Two consecutive smoke calls produce equal verdicts"
    - name: teardown
      description: "Drop RecipeContext"
      invariant: "context.temp_dir cleaned up"

equations:
  loader_dispatch:
    formula: "smoke(fixture, fmt) ↦ Ok | LoaderUnavailable | InvalidFixture"
    domain: "fixture: Path; fmt: String"
    codomain: "SmokeVerdict"
    invariants:
      - "Family on Ok arm always 'deepseek'"
      - "Missing n_routed_experts surfaces LoaderUnavailable (DeepSeek MoE discriminator)"
    preconditions:
      - "fixture is a valid UTF-8 path string"
      - "fmt ∈ {safetensors, apr, gguf}"
    postconditions:
      - "match Ok { family, .. } => family == 'deepseek'"
    lean_theorem: "Theorems.Deepseek.LoaderDispatch"
    tolerance: 0
    lean:
      theorem: "Theorems.Deepseek.LoaderDispatch"
      status: wip
      module: "lean/Theorems/Deepseek.lean"

  moe_discriminator:
    formula: "config without n_routed_experts ↦ LoaderUnavailable"
    domain: "fixture: Path"
    codomain: "SmokeVerdict"
    invariants:
      - "DeepSeek's MoE topology is declared via n_routed_experts + num_experts_per_tok"
    preconditions:
      - "fixture is readable"
    postconditions:
      - "match Ok { n_routed_experts, .. } => n_routed_experts == config.n_routed_experts"
    lean_theorem: "Theorems.Deepseek.MoEDiscriminator"
    tolerance: 0
    lean:
      theorem: "Theorems.Deepseek.MoEDiscriminator"
      status: wip
      module: "lean/Theorems/Deepseek.lean"

  forward_determinism:
    formula: "forward_sim(seed, vocab, hidden, n_experts) is deterministic and n_experts-sensitive"
    domain: "seed: u64; vocab,hidden,n_experts: u32"
    codomain: "u32"
    invariants:
      - "n_experts seeds the accumulator"
    preconditions:
      - "seed | 1 != 0"
    postconditions:
      - "forward_sim(s, v, h, n) == forward_sim(s, v, h, n)"
      - "forward_sim(42, 256, 64, 8) != forward_sim(42, 256, 64, 16)"
    lean_theorem: "Theorems.Deepseek.ForwardDeterminism"
    tolerance: 0
    lean:
      theorem: "Theorems.Deepseek.ForwardDeterminism"
      status: wip
      module: "lean/Theorems/Deepseek.lean"

proof_obligations:
  - type: invariant
    property: "Loader dispatch is total"
    formal: "for all fixture, fmt. smoke(fixture, fmt) ↦ SmokeVerdict"
    tolerance: 0.0
    applies_to: loader_dispatch
    lean:
      theorem: "Theorems.Deepseek.LoaderDispatch"
      module: "ProvableContracts.ArchitectureDemos.Deepseek"
  - type: invariant
    property: "n_routed_experts required"
    formal: "fixture without n_routed_experts ↦ LoaderUnavailable"
    tolerance: 0.0
    applies_to: moe_discriminator
    lean:
      theorem: "Theorems.Deepseek.MoEDiscriminator"
      module: "ProvableContracts.ArchitectureDemos.Deepseek"
  - type: invariant
    property: "Forward simulation is n_experts-sensitive"
    formal: "n_experts participates in checksum"
    tolerance: 0.0
    applies_to: forward_determinism
    lean:
      theorem: "Theorems.Deepseek.ForwardDeterminism"
      module: "ProvableContracts.ArchitectureDemos.Deepseek"

falsification_tests:
  - id: FALSIFY-DEEPSEEK-001
    rule: "MoE fields are recognized"
    prediction: "n_routed_experts=8, experts_per_tok=2 for the bundled DeepSeek fixture"
    test: "cargo test --example inference_deepseek_smoke -- happy_path_moe_fields_present"
    if_fails: "MoE field detection broke"
  - id: FALSIFY-DEEPSEEK-002
    rule: "Forward simulation is n_experts-sensitive"
    prediction: "forward_sim with 8 experts != forward_sim with 16 experts"
    test: "cargo test --example inference_deepseek_smoke -- n_experts_affects_checksum"
    if_fails: "n_experts dropped from accumulator seeding"
  - id: FALSIFY-DEEPSEEK-003
    rule: "Forward simulation is deterministic per seed"
    prediction: "Same seed → same output"
    test: "cargo test --example inference_deepseek_smoke -- forward_sim_deterministic_per_seed"
    if_fails: "Non-determinism leaked"

kani_harnesses:
  - id: KANI-DEEPSEEK-001
    obligation: "Deterministic verdict on equal inputs"
    bound: 4
    strategy: bounded_int
    harness: "kani_harnesses::deepseek_smoke_deterministic"
  - id: KANI-DEEPSEEK-002
    obligation: "InvalidFixture is total"
    bound: 4
    strategy: bounded_int
    harness: "kani_harnesses::deepseek_smoke_invalid_fixture_total"

qa_gate:
  id: F-DEEPSEEK-001
  name: "DeepSeek Smoke Inference Contract"
  description: "Smoke load + MoE discriminator + deterministic forward simulation"
  checks:
    - "moe_fields_present"
    - "n_experts_affects_checksum"
    - "forward_determinism"
  pass_criteria: "All three falsification tests pass"
