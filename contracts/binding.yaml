version: 1.0.0
target_crate: apr-cookbook
# Maps each contract equation to the Rust kernel (or meta-target) that implements it.
# status values: implemented | partial | pending | not_implemented
#   implemented   — real Rust code exists and is exercised by tests
#   partial       — kernel exists but only some obligations are covered
#   pending       — kernel exists upstream (aprender-core) but no cookbook harness
#   not_implemented — no binding (fully aspirational)
# Meta-contracts about the repo itself (cli-parity, docs-schema) bind to
# Makefile targets under the conventional `cookbook::make::<target>` module
# path, which pv accepts as the "implementing kernel" for structural invariants.
bindings:
# ============================================================================
# mmap-inference-v1 — F2 in-process falsification (tests/falsification.rs)
# ============================================================================
- contract: mmap-inference-v1.yaml
  equation: mmap_latency
  module_path: apr_cookbook::bundle::v2::BundledModelV2
  function: from_bytes
  signature: 'fn from_bytes(bytes: &[u8]) -> Result<Self>'
  status: implemented
  notes: Exercised by tests/falsification.rs::f2_zero_copy_loading_latency with a real memmap2::Mmap over a tempfile.
- contract: mmap-inference-v1.yaml
  equation: first_access_latency
  module_path: apr_cookbook::tests::falsification
  function: f2_zero_copy_loading_latency
  signature: 'cargo test --test falsification -- --nocapture'
  status: implemented
  notes: F2 measures end-to-end mmap + first-byte access over 1000 iterations with p50/p95/p99 percentiles. Because mmap doesn't page-in until touched, the measured total IS the first-access latency path. Release threshold p95 < 0.1 ms, debug p95 < 10 ms.
- contract: mmap-inference-v1.yaml
  equation: zero_copy
  module_path: apr_cookbook::bundle::v2::BundledModelV2
  function: from_bytes
  signature: 'fn from_bytes(bytes: &[u8]) -> Result<Self>'
  status: implemented
  notes: Returns slice views into the mmap region; no heap copies. Verified via memmap2 semantics.

