# ============================================================================
# avx512-matmul-v1 — performance claim deleted in v5.0 (F7); kernel is upstream
# ============================================================================
- contract: avx512-matmul-v1.yaml
  equation: matmul
  module_path: trueno::Matrix
  function: matmul
  signature: 'fn matmul(&self, rhs: &Matrix) -> Matrix'
  status: implemented
  notes: SIMD matmul lives in aprender-compute (lib trueno). No published AVX-512 GFLOPS measurement in this repo.
- contract: avx512-matmul-v1.yaml
  equation: throughput
  module_path: apr_cookbook::tests::throughput
  function: matmul_throughput_above_1_gflops
  signature: 'cargo test --test throughput -- --nocapture'
  status: implemented
  notes: Conservative 1 GFLOPS floor via `trueno::Matrix::matmul` on 256×256 f32. Measured 110 GFLOPS release. The deleted F7 ≥ 80 GFLOPS AVX-512 peak claim is still out of scope (platform-specific).
- contract: avx512-matmul-v1.yaml
  equation: scalar_equivalence
  module_path: apr_cookbook::tests::throughput
  function: matmul_matches_naive_reference
  signature: 'cargo test --test throughput matmul_matches_naive_reference'
  status: implemented
  notes: Verifies trueno `matmul` on a 2×2 input matches the naive reference element-wise within 1e-4 tolerance. Acts as a regression tripwire for SIMD↔scalar parity.

