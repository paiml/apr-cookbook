# cargo-deny configuration
# Deployed from paiml/infra — do not edit manually.
# Spec: docs/specifications/unified-ci-pipeline.md

[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
ignore = [
    # Rows are UNMAINTAINED notices only (informational, no patched release, no code fix).
    # Vulnerabilities are never ignored here: they are fixed by a lockfile or pin bump.
    # Every row names a crate that IS in Cargo.lock; a row whose crate has left the tree is
    # deleted in the same change (reviewed 2026-11-24 against the aprender 0.74.0 lock:
    # instant, number_prefix, bincode, rustls-pemfile, lru and proc-macro-error are gone).
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained; transitive via simba/nalgebra/parquet, use pastey when upstream migrates" },
    # Same rows as the fleet template (paiml/infra machines/clean-room/templates/deny.toml).
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2: unmaintained; transitive via validator_derive across the aprender stack; no drop-in replacement adopted upstream" },
    { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained (patched=[], no patched release); carried by the published aprender crates; replacement tracked in aprender#7191" },
    # Not in the fleet template yet. unsafe-libyaml arrives only through serde_yaml 0.9, which this
    # crate uses (validate_recipe) and which
    # aprender-contracts, aprender-simulate and aprender-train still declare in their newest
    # published version (0.75.3, read from crates.io 2026-11-24). No change in this repo can
    # remove it; this row goes when those three crates publish without serde_yaml (aprender#7103).
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml: unmaintained (archived, no safe upgrade); via serde_yaml 0.9 in published aprender-contracts/-simulate/-train <= 0.75.3; upstream aprender#7103" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "0BSD",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "MIT-0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["paiml"]
